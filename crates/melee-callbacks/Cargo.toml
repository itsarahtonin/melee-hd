[package]
name = "melee-callbacks"
description = "melee-sim's #[callbacks] attribute: dispatch matches on the original's addresses as entries of one callback table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }

[package]
name = "melee-player"
description = "Plays a VS match in a window: melee-sim stepped at 60 ticks a second with rendering, sound and controllers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "melee-hd"
path = "src/main.rs"

[dependencies]
melee-audio = { path = "../melee-audio" }
melee-data.workspace = true
melee-input = { path = "../melee-input" }
melee-render = { path = "../melee-render" }
melee-slippi = { path = "../melee-slippi" }
melee-sim.workspace = true
melee-gpu = { path = "../melee-gpu" }
pollster = "1"
wgpu = "30"
winit = "0.30"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
png = "0.18"
# The disc picker and the error boxes; Common Controls 6 for their own button labels, which
# build.rs's manifest asks for.
rfd = { version = "0.17", features = ["common-controls-v6"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"

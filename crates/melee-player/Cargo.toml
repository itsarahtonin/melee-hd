[package]
name = "melee-player"
description = "Plays a VS match in a window: melee-sim stepped at 60 ticks a second with rendering, sound and controllers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "melee-hd"
path = "src/main.rs"

[dependencies]
melee-audio = { path = "../melee-audio" }
melee-data.workspace = true
melee-input = { path = "../melee-input" }
melee-render = { path = "../melee-render" }
melee-replay = { path = "../../tools/replay" }
melee-sim.workspace = true
ssbm-render.workspace = true
ssbm-slippi.workspace = true
pollster = "1"
wgpu = "30"
winit = "0.30"

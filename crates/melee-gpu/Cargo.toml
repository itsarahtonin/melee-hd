[package]
name = "melee-gpu"
description = "Draws the GameCube GPU's command stream with wgpu: ssbm-rs's renderer (ssbm-render at melee-hd-base), with the player's resolution scaling and widescreen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ssbm-gx.workspace = true
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
rayon = "1"

[package]
name = "melee-sim"
description = "Melee's game simulation: deterministic, bit-exact with the console, independent of rendering and I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# melee-hd's faster copy of ssbm-rs's gekko-fp (docs/performance.md); ssbm-rs's crates, the
# leaf-checks' reference among them, keep the upstream crate.
gekko-fp = { package = "melee-gekko-fp", path = "../gekko-fp" }
melee-data.workspace = true
melee-callbacks = { path = "../melee-callbacks" }
melee-derive = { path = "../melee-derive" }
# The native save's card layers (`lb::save`).
melee-save = { path = "../melee-save" }

[dev-dependencies]
# A check that skips without its data fails under MELEE_CHECKS_REQUIRE_DATA (`melee_local_data::skip!`).
melee-local-data = { path = "../../tools/local-data" }

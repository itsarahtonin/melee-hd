# What never goes into the repository: personal paths and names, build output, and oversized
# files. One list for both checks: .githooks/path-guard.sh (the pre-commit, pre-merge-commit and
# pre-push hooks) and tools/path-guard (CI and `cargo test`).
#
#   deny PATTERN    no tracked file's content, text or binary, may match this POSIX extended
#                   regex (as `git grep -E` reads it)
#   allow NAME      a deny match whose last path component is NAME (trailing dots aside) is fine:
#                   placeholders and shared folders, not people
#   forbid DIR/     no tracked file may live under this folder at the repository's root
#   max-size BYTES  no tracked file may be larger, unless it is listed with `large`
#   large PATH      a tracked file allowed over max-size
#
# Names that must not appear anywhere, such as a username, would give themselves away here, so
# they live outside the repository: `git config --add path-guard.name NAME` in a checkout, or
# PATH_GUARD_NAMES (whitespace-separated). They match anywhere, ignoring case.

# Home folders, Users/<name> (Windows, macOS) and home/<name>, with either slash, escaped or not.
deny [\\/]Users[\\/]+[A-Za-z0-9_][^]\\/"'<>|:*?[:space:],;()`[]*
deny /home/[A-Za-z0-9_][^]\\/"'<>|:*?[:space:],;()`[]*
# OneDrive folders, personal or an organization's (OneDrive - <org>).
deny OneDrive( - [^]\\/"'<>|:*?]+)?[\\/]
# Agents' scratch folders: claude folders in the temporary folder.
deny AppData[\\/]+Local[\\/]+Temp[\\/]+claude
deny [\\/]([Tt]emp|TEMP|tmp)[\\/]+claude[\\/-]

allow USER
allow Public
allow Default
allow Shared

forbid dist/
forbid target/

max-size 5242880
# The benchmark matches' replays are kept in the repository (data/bench).
large data/bench/ics-peach-ps.slp

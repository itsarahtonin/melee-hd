[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["tools/structgen", "tools/tables"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"
publish = false

[workspace.dependencies]
melee-data = { path = "crates/melee-data" }
melee-sim = { path = "crates/melee-sim" }
# Stage 1, the reference: its ports at this tag are what the simulation is checked against.
gekko-fp = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-slippi = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-game = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-rt = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-disc = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-types = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }

# The release build optimized as one program, for timing and shipping: about 8% faster than
# release on the native benchmark (docs/performance.md), and slower to build, so checks and
# tests stay on release. `cargo build --profile dist -p melee-bench`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

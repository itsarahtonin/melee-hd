[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["tools/structgen", "tools/tables"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/itsarahtonin/melee-hd"
rust-version = "1.98"
publish = false

[workspace.dependencies]
melee-data = { path = "crates/melee-data" }
melee-sim = { path = "crates/melee-sim" }
# Stage 1, the reference: its ports at this tag are what the simulation is checked against.
gekko-fp = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-slippi = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-game = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-rt = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-ppc = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-disc = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }
ssbm-types = { git = "https://github.com/itsarahtonin/ssbm-rs", tag = "melee-hd-base" }

# The player's build (`cargo run -p dist`): the release build optimized as one program. Slower to
# build, so checks and tests stay on release.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The speed numbers that decide anything (docs/performance.md, "Which build"): `dist`'s settings
# exactly, in a folder of its own so the bench and the player don't rebuild each other's output.
# `cargo build --locked --profile bench-dist -p melee-bench`.
[profile.bench-dist]
inherits = "dist"

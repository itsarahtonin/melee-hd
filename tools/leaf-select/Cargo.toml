[package]
name = "leaf-select"
description = "Keys each leaf-check job on the source of the functions it runs, from a coverage pass, so the verification reruns only the jobs a change reaches"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
sha1 = "0.10.7"
syn = { version = "2.0.119", features = ["full", "parsing", "printing", "visit-mut"] }
